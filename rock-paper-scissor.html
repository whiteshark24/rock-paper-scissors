<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-paper-scissor</title>
    <link rel="stylesheet" href="./rock-paper-scissor.css">
</head>

<body>
    <div class="container">
        <p class="tittle">Rock Paper Scissors</p>
        <button class="move-button js-rock-button" title="Rock">
        <img class="move-icon" src="/icon/rock-emoji.png" alt="Rock emoji">
    </button>

        <button class="move-button js-paper-button" title="Paper">
        <img class="move-icon" src="/icon/paper-emoji.png" alt="Paper emoji">
    </button>

        <button class="move-button js-scissor-button" title="Scissors">
        <img class="move-icon" src="/icon/scissors-emoji.png" alt="Scissors emoji">
    </button>

        <p class="js-result result"></p>
        <p class="js-moves"></p>
        <p class="js-score score"></p>

        <button class="reset-score-button js-reset-button">Reset Score</button>
        <button class="auto-play-button js-auto-play-button">Auto Play</button>
    </div>
    <script src="/rock-paper-scissor.js"></script>
</body>

</html>
